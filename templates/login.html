{% extends "base.html" %}
{% block auth %}
<div class="card">
  <h2>🛡 Hotel Security Login</h2>
  <form method="post">
    <label>Username</label><input name="username" required autofocus>
    <label>Password</label><input type="password" name="password" required>
    <button class="btn b1">Sign In</button>
  </form>
  <p class="links"><a href="{{ url_for('forgot') }}">Forgot password?</a> · <a href="{{ url_for('register') }}">Create account</a></p>
</div>
{% endblock %}
